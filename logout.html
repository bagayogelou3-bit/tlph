
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagayo Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #dbeafe, #c4b5fd, #fbcfe8);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
    }

    header h2 {
      margin: 0;
      color: #4338ca;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .logout {
      color: white;
      background: #ef4444;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }

    main {
      max-width: 850px;
      margin: 70px auto;
      padding: 40px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(30, 41, 59, 0.12);
    }

    main h1 {
      font-size: clamp(30px, 5vw, 48px);
      color: #4338ca;
    }

    main p {
      line-height: 1.8;
      color: #475569;
    }

    .explore {
      margin-top: 15px;
      color: white;
      background: #4f46e5;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      main {
        margin: 35px 16px;
        padding: 30px 18px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2>Bagayo Website</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <main>
    <h1>Welcome to Our Website!</h1>
    <p>
      Explore our products, learn more about us,
      and enjoy your visit.
    </p>
    <button class="explore" onclick="location.href='product.html'">
      Explore Products
    </button>
  </main>

  <script>
    function logout() {
      if (confirm("Are you sure you want to log out?")) {
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
